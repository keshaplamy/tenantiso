[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keshaplamy-tenantiso"
version = "0.1.0"
description = "比对各租户的资源占用与配额，标出互相影响的位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "keshaplamy" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://keshaplamy.github.io"
Repository = "https://github.com/keshaplamy/tenantiso"
Issues = "https://github.com/keshaplamy/tenantiso/issues"

[project.scripts]
tenantiso = "tenantiso:main"

[tool.setuptools]
py-modules = ["tenantiso"]
